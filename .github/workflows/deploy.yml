name: Build & push images to GHCR

# Compila las imágenes Docker en los runners de GitHub (CPU potente, gratis)
# y las publica al registry GHCR. El VPS solo hace `docker compose pull` → el
# deploy pasa de ~30 min (compilando Vite en el VPS) a segundos. El trabajo
# pesado sale del servidor: GitHub compila, el VPS solo sirve. (11-jun-2026)

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  # Valida ANTES de gastar minutos compilando imágenes Docker: type-check +
  # build de los workspaces TS + lint. Si algo no compila, falla aquí en
  # segundos en vez de aflorar tras minutos de `docker build`. (16-jun-2026)
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # shared se compila primero: api y web hacen type-check contra su dist/.
      - name: Build shared
        run: npm run build:shared

      - name: Type-check & build API
        run: npm run build --workspace=apps/api

      - name: Type-check & build web
        run: npm run build --workspace=apps/web

      # Lint no bloqueante: ESLint v9 exige eslint.config.js y el repo aún no lo
      # tiene → sin continue-on-error tumbaría TODO el publish a GHCR (build
      # needs: validate). Cuando se añada la config de ESLint, quitar esta línea.
      - name: Lint
        continue-on-error: true
        run: npm run lint --workspaces --if-present

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # necesario para publicar a ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fitolink-web
            dockerfile: docker/Dockerfile.web
          - image: fitolink-api
            dockerfile: docker/Dockerfile.api
          - image: fitolink-geo
            dockerfile: docker/Dockerfile.geo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          # Build args del frontend (los Dockerfiles api/geo los ignoran).
          # VITE_API_URL vacío: el proxy nginx del VPS enruta /api en runtime.
          # VITE_GOOGLE_CLIENT_ID: client ID PÚBLICO de OAuth (va en el bundle
          # del front igualmente) → necesario para el login con Google. Se lee
          # del secret GOOGLE_CLIENT_ID del repo (Settings → Secrets → Actions).
          build-args: |
            VITE_API_URL=
            VITE_SHOW_DEMO=false
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          # Cache entre corridas → builds incrementales rápidos.
          cache-from: type=gha
          cache-to: type=gha,mode=max
