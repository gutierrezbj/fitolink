name: Build & push images to GHCR

# Compila las imágenes Docker en los runners de GitHub (CPU potente, gratis)
# y las publica al registry GHCR. El VPS solo hace `docker compose pull` → el
# deploy pasa de ~30 min (compilando Vite en el VPS) a segundos. El trabajo
# pesado sale del servidor: GitHub compila, el VPS solo sirve. (11-jun-2026)

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # necesario para publicar a ghcr.io
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fitolink-web
            dockerfile: docker/Dockerfile.web
          - image: fitolink-api
            dockerfile: docker/Dockerfile.api
          - image: fitolink-geo
            dockerfile: docker/Dockerfile.geo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          # Build args del frontend (los Dockerfiles api/geo los ignoran).
          # VITE_API_URL vacío: el proxy nginx del VPS enruta /api en runtime.
          build-args: |
            VITE_API_URL=
            VITE_SHOW_DEMO=true
          # Cache entre corridas → builds incrementales rápidos.
          cache-from: type=gha
          cache-to: type=gha,mode=max
