server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api → contenedor api (red interna de Docker). Necesario en LOCAL,
    # donde no hay nginx de host. En PROD este bloque queda dormido (el nginx
    # del host enruta /api directamente). resolver + variable → nginx arranca
    # aunque el contenedor api aún no resuelva en DNS (resolución en runtime).
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $upstream_api api:4040;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # La "shell" del SPA (index.html) SIEMPRE revalidada. Sin esto el
        # navegador la cachea por heurística y sigue cargando el bundle viejo
        # tras un deploy ("volvió a la versión inicial"). no-cache = se guarda
        # pero se revalida con ETag (304 si no cambió → barato). Los assets van
        # hasheados + immutable (bloque de abajo), así que solo la shell revalida.
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
