services:
  web:
    # Imagen pre-construida en GHCR por GitHub Actions (.github/workflows/deploy.yml).
    # El VPS hace `docker compose pull` y NO compila Vite localmente → deploy en
    # segundos en vez de ~30 min. El bloque `build` se mantiene como rollback:
    # `docker compose up -d --build` vuelve a compilar en el VPS si GHCR fallara.
    # (11-jun-2026 · sacar el build pesado del VPS)
    image: ghcr.io/gutierrezbj/fitolink-web:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      # Build args del frontend (se embeben en el bundle al compilar). Para el
      # flujo GHCR estos mismos valores se pasan en .github/workflows/deploy.yml
      # desde los secrets del repo. Para el rollback `--build` se leen del .env
      # del VPS. VITE_GOOGLE_CLIENT_ID es el client ID público de OAuth (va en
      # el front de todas formas) → hace funcionar el login con Google.
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        # Paridad con .github/workflows/deploy.yml: la consola demo va
        # encendida también si se rebuildea en el VPS como rollback.
        VITE_SHOW_DEMO: ${VITE_SHOW_DEMO:-true}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - '127.0.0.1:3040:3000'
    restart: unless-stopped

  api:
    image: ghcr.io/gutierrezbj/fitolink-api:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - '127.0.0.1:4040:4040'
    environment:
      - NODE_ENV=production
      - PORT=4040
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI no definido en el .env del VPS}
      - JWT_SECRET=${JWT_SECRET:?Falta JWT_SECRET en el .env del VPS (genera uno con openssl rand -base64 32)}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # (RESEND_API_KEY retirada 11-jul-2026: ningún código de la API la lee —
      # el stack de email real es Gmail SMTP vía nodemailer, ver emailService.ts)
      # Dev-login (chips de demo como "Jorge"). Configurable vía .env del VPS
      # — default false por seguridad: en producción sin el .env, el bypass de
      # auth queda DESACTIVADO. Para la demo, el .env del VPS lleva
      # ALLOW_DEV_LOGIN=true. (Antes estaba hardcoded a mano en el VPS.)
      - ALLOW_DEV_LOGIN=${ALLOW_DEV_LOGIN:-false}
      # NASA FIRMS (card "Focos térmicos" + sección fuego del digest). Sin la
      # key el servicio devuelve [] a propósito y la card muestra siempre
      # "Sin focos activos". Key GRATIS (formulario de 2 min):
      # https://firms.modaps.eosdis.nasa.gov/api/map_key/ → al .env del VPS.
      # (11-jul-2026 · antes esta var NI SE REENVIABA al contenedor: aunque
      # estuviera en el .env del VPS, el proceso Node no la veía.)
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      # Digest matinal ~07:00 Madrid (email de campo + creador de alertas
      # fire_proximity). Off por defecto; activar con DIGEST_CRON=true en el
      # .env del VPS. Sin SMTP_* configurado el email corre en modo dry-run
      # (solo loguea, no envía) — ver emailService.ts.
      - DIGEST_CRON=${DIGEST_CRON:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      # El default repite el del schema zod (env.ts) porque una cadena vacía
      # NO activa el default de zod — sin esto, el From saldría vacío.
      - SMTP_FROM=${SMTP_FROM:-FitoLink Alertas <AlertasAgrom@systemrapid.io>}
      # Destinatarios del formulario público "solicitar demo" (emailService
      # los lee de process.env con fallback demo@example.com — buzón que NO
      # existe). Definirlos en el .env del VPS ANTES de configurar SMTP_*,
      # o los leads se enviarían a un buzón muerto con log de éxito.
      - DEMO_REQUEST_TO=${DEMO_REQUEST_TO:-}
      - DEMO_REQUEST_CC=${DEMO_REQUEST_CC:-}
    restart: unless-stopped
    # Healthcheck contra GET /api/health (puerto 4040). La imagen base es
    # node:alpine (sin curl) → usamos el wget de BusyBox. Mientras el contenedor
    # no responda 200, queda `unhealthy` y el proxy (depends_on: service_healthy)
    # no arranca → evita los 502 de los primeros segundos de arranque. (16-jun-2026)
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4040/api/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  geo-pipeline:
    image: ghcr.io/gutierrezbj/fitolink-geo:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.geo
    environment:
      - MONGODB_URI=mongodb://mongo:27017/fitolink
      - COPERNICUS_CLIENT_ID=${COPERNICUS_CLIENT_ID}
      - COPERNICUS_CLIENT_SECRET=${COPERNICUS_CLIENT_SECRET}
    networks:
      - default
      - fitolink_default
    restart: 'no'
    # Run via cron on the host: docker compose -f docker-compose.prod.yml run --rm geo-pipeline

  proxy:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_started
      # El proxy espera a que la API esté healthy (no solo arrancada) antes de
      # enrutar → sin esto nginx podría devolver 502 mientras la API aún levanta.
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  fitolink_default:
    external: true
