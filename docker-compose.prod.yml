services:
  web:
    # Imagen pre-construida en GHCR por GitHub Actions (.github/workflows/deploy.yml).
    # El VPS hace `docker compose pull` y NO compila Vite localmente → deploy en
    # segundos en vez de ~30 min. El bloque `build` se mantiene como rollback:
    # `docker compose up -d --build` vuelve a compilar en el VPS si GHCR fallara.
    # (11-jun-2026 · sacar el build pesado del VPS)
    image: ghcr.io/gutierrezbj/fitolink-web:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      # Build args del frontend (se embeben en el bundle al compilar). Para el
      # flujo GHCR estos mismos valores se pasan en .github/workflows/deploy.yml
      # desde los secrets del repo. Para el rollback `--build` se leen del .env
      # del VPS. VITE_GOOGLE_CLIENT_ID es el client ID público de OAuth (va en
      # el front de todas formas) → hace funcionar el login con Google.
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - '127.0.0.1:3040:3000'
    restart: unless-stopped

  api:
    image: ghcr.io/gutierrezbj/fitolink-api:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - '127.0.0.1:4040:4040'
    environment:
      - NODE_ENV=production
      - PORT=4040
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      # Dev-login (chips de demo como "Jorge"). Configurable vía .env del VPS
      # — default false por seguridad: en producción sin el .env, el bypass de
      # auth queda DESACTIVADO. Para la demo, el .env del VPS lleva
      # ALLOW_DEV_LOGIN=true. (Antes estaba hardcoded a mano en el VPS.)
      - ALLOW_DEV_LOGIN=${ALLOW_DEV_LOGIN:-false}
    restart: unless-stopped

  geo-pipeline:
    image: ghcr.io/gutierrezbj/fitolink-geo:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.geo
    environment:
      - MONGODB_URI=mongodb://mongo:27017/fitolink
      - COPERNICUS_CLIENT_ID=${COPERNICUS_CLIENT_ID}
      - COPERNICUS_CLIENT_SECRET=${COPERNICUS_CLIENT_SECRET}
    networks:
      - default
      - fitolink_default
    restart: 'no'
    # Run via cron on the host: docker compose -f docker-compose.prod.yml run --rm geo-pipeline

  proxy:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

networks:
  fitolink_default:
    external: true
