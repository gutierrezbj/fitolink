services:
  mongo:
    image: mongo:7
    ports:
      - '127.0.0.1:6040:27017'
    volumes:
      - fitolink-mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fitolink
    restart: unless-stopped
    # Healthcheck para que la api pueda esperar a `service_healthy` (no solo a
    # que el contenedor exista). mongosh viene en la imagen mongo:7.
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - '127.0.0.1:4040:4040'
    # .env injected wholesale so secrets like SMTP_PASS, RESEND_API_KEY,
    # COPERNICUS_*, JWT_SECRET (when overridden) reach the container
    # without listing every variable here. Explicit `environment` overrides
    # take precedence and define the in-container hostnames (MongoDB, port).
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4040
      - MONGODB_URI=mongodb://mongo:27017/fitolink
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src
    # Healthcheck contra GET /api/health (puerto 4040). La imagen base es
    # node:alpine (sin curl) → usamos el wget de BusyBox. (16-jun-2026)
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4040/api/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SHOW_DEMO: ${VITE_SHOW_DEMO:-true}
    ports:
      # Solo aplica al flujo LOCAL (Mac): prod usa docker-compose.prod.yml en
      # SOLITARIO (deploy-ghcr.sh), que fija 127.0.0.1:3040. Aquí el bind es
      # parametrizable: default 127.0.0.1 (seguro); el Mac de demos pone
      # WEB_BIND=0.0.0.0 en su .env para exponer :3040 a la red local y a
      # Tailscale como 2ª vía si el túnel cloudflared no estuviera arriba. NO es
      # internet público (el router no reenvía 3040). No mezclar este fichero
      # con docker-compose.prod.yml (con WEB_BIND=0.0.0.0 daría doble bind 3040).
      - '${WEB_BIND:-127.0.0.1}:3040:3000'
    environment:
      - VITE_API_URL=http://localhost:4040
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    volumes:
      - ./apps/web/src:/app/apps/web/src

  pipeline:
    build:
      context: ./workers/geo-pipeline
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://mongo:27017/fitolink
      - COPERNICUS_CLIENT_ID=${COPERNICUS_CLIENT_ID}
      - COPERNICUS_CLIENT_SECRET=${COPERNICUS_CLIENT_SECRET}
      - USE_OPENEO=true
      - NDVI_GRID_ENABLED=true
      - NDVI_GRID_RESOLUTION=20
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fitolink-mongo-data:
