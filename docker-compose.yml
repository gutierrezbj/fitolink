services:
  mongo:
    image: mongo:7
    ports:
      - '127.0.0.1:6040:27017'
    volumes:
      - fitolink-mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: fitolink

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - '127.0.0.1:4040:4040'
    # .env injected wholesale so secrets like SMTP_PASS, RESEND_API_KEY,
    # COPERNICUS_*, JWT_SECRET (when overridden) reach the container
    # without listing every variable here. Explicit `environment` overrides
    # take precedence and define the in-container hostnames (MongoDB, port).
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=4040
      - MONGODB_URI=mongodb://mongo:27017/fitolink
    depends_on:
      - mongo
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/shared/src:/app/packages/shared/src

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SHOW_DEMO: ${VITE_SHOW_DEMO:-true}
    ports:
      - '127.0.0.1:3040:3000'
    environment:
      - VITE_API_URL=http://localhost:4040
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    volumes:
      - ./apps/web/src:/app/apps/web/src

  pipeline:
    build:
      context: ./workers/geo-pipeline
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://mongo:27017/fitolink
      - COPERNICUS_CLIENT_ID=${COPERNICUS_CLIENT_ID}
      - COPERNICUS_CLIENT_SECRET=${COPERNICUS_CLIENT_SECRET}
      - USE_OPENEO=true
      - NDVI_GRID_ENABLED=true
      - NDVI_GRID_RESOLUTION=20
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  fitolink-mongo-data:
