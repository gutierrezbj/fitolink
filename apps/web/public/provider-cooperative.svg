<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle: warm brown gold (cooperative — strategic, distinct from companies) -->
  <circle cx="32" cy="32" r="32" fill="#a16207"/>
  <!-- Big building (the coop HQ) -->
  <rect x="20" y="20" width="24" height="30" fill="#fff" rx="1.2"/>
  <!-- Gable / silos hint -->
  <path d="M20 20 L32 12 L44 20 Z" fill="#fef3c7"/>
  <!-- Door -->
  <rect x="29" y="40" width="6" height="10" fill="#a16207" rx="0.6"/>
  <!-- Windows in 3 rows × 3 cols -->
  <g fill="#a16207">
    <rect x="23" y="24" width="3" height="3" rx="0.4"/>
    <rect x="30.5" y="24" width="3" height="3" rx="0.4"/>
    <rect x="38" y="24" width="3" height="3" rx="0.4"/>
    <rect x="23" y="30" width="3" height="3" rx="0.4"/>
    <rect x="30.5" y="30" width="3" height="3" rx="0.4"/>
    <rect x="38" y="30" width="3" height="3" rx="0.4"/>
    <rect x="23" y="36" width="3" height="3" rx="0.4"/>
    <rect x="38" y="36" width="3" height="3" rx="0.4"/>
  </g>
  <!-- Three small farmer figures around the base (suggests "many members") -->
  <g fill="#fef3c7">
    <circle cx="13" cy="46" r="2.2"/>
    <rect x="11" y="48" width="4" height="6" rx="1"/>
    <circle cx="51" cy="46" r="2.2"/>
    <rect x="49" y="48" width="4" height="6" rx="1"/>
    <circle cx="32" cy="56" r="2.2"/>
    <rect x="30" y="58" width="4" height="5" rx="1"/>
  </g>
  <!-- Thin connectors to the building (network) -->
  <g stroke="#fef3c7" stroke-width="0.7" opacity="0.7">
    <line x1="15" y1="46" x2="22" y2="42"/>
    <line x1="49" y1="46" x2="42" y2="42"/>
    <line x1="32" y1="54" x2="32" y2="50"/>
  </g>
  <!-- Telemetry signal arc top right -->
  <path d="M46 16 Q54 16 54 8" stroke="#fbbf24" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle cx="54" cy="8" r="1.5" fill="#fbbf24"/>
</svg>
