<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#46632e"/>
  <!-- Central plant stem -->
  <line x1="32" y1="56" x2="32" y2="30" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Three pairs of leaves (foliar focus) -->
  <ellipse cx="24" cy="40" rx="6" ry="3" fill="#bbf7d0" transform="rotate(-25 24 40)"/>
  <ellipse cx="40" cy="40" rx="6" ry="3" fill="#bbf7d0" transform="rotate(25 40 40)"/>
  <ellipse cx="22" cy="32" rx="5" ry="2.5" fill="#fff" transform="rotate(-30 22 32)"/>
  <ellipse cx="42" cy="32" rx="5" ry="2.5" fill="#fff" transform="rotate(30 42 32)"/>
  <!-- Top growth bud -->
  <ellipse cx="32" cy="28" rx="3" ry="5" fill="#fff"/>
  <!-- Nutrient droplets falling onto leaves (gold = nutrients) -->
  <circle cx="20" cy="18" r="1.6" fill="#fbbf24"/>
  <circle cx="32" cy="14" r="1.6" fill="#fbbf24"/>
  <circle cx="44" cy="18" r="1.6" fill="#fbbf24"/>
  <circle cx="26" cy="22" r="1.2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="38" cy="22" r="1.2" fill="#fbbf24" opacity="0.8"/>
  <!-- Trajectories (subtle) -->
  <line x1="20" y1="20" x2="22" y2="30" stroke="#fbbf24" stroke-width="0.8" opacity="0.5"/>
  <line x1="44" y1="20" x2="42" y2="30" stroke="#fbbf24" stroke-width="0.8" opacity="0.5"/>
</svg>
