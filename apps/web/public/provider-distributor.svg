<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle: warm orange (distinguishes from green services) -->
  <circle cx="32" cy="32" r="32" fill="#c2410c"/>
  <!-- Crate / box -->
  <rect x="14" y="22" width="36" height="28" rx="2" fill="#fff"/>
  <!-- Top flap fold lines -->
  <line x1="14" y1="28" x2="50" y2="28" stroke="#c2410c" stroke-width="1.2"/>
  <!-- Vertical separators on the box -->
  <line x1="26" y1="22" x2="26" y2="50" stroke="#fed7aa" stroke-width="1.2"/>
  <line x1="38" y1="22" x2="38" y2="50" stroke="#fed7aa" stroke-width="1.2"/>
  <!-- Capsule pill in the central panel -->
  <rect x="29" y="33" width="6" height="12" rx="3" fill="#c2410c"/>
  <line x1="29" y1="39" x2="35" y2="39" stroke="#fff" stroke-width="0.9"/>
  <!-- Leaf in left panel -->
  <path d="M17 36 q3 -6 8 -2 q-2 6 -8 2 z" fill="#65a30d"/>
  <!-- Bottle in right panel -->
  <path d="M44 31 v-3 h2 v3 q3 2 3 5 v9 q0 2 -2 2 h-4 q-2 0 -2 -2 v-9 q0 -3 3 -5 z" fill="#fed7aa" stroke="#c2410c" stroke-width="0.9"/>
  <!-- Telemetry signal arc top right -->
  <path d="M45 16 Q53 16 53 8" stroke="#fbbf24" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle cx="53" cy="8" r="1.5" fill="#fbbf24"/>
</svg>
