<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#46632e"/>
  <!-- Magnifying glass lens -->
  <circle cx="28" cy="28" r="13" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="28" cy="28" r="10" fill="#bbf7d0" opacity="0.18"/>
  <!-- Magnifying glass handle -->
  <line x1="38" y1="38" x2="50" y2="50" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Plant leaf inside the lens (subject of diagnosis) -->
  <path d="M28 35 Q22 30 22 24 Q22 22 24 22 Q30 22 32 28 L28 35 Z" fill="#fff"/>
  <line x1="28" y1="35" x2="26" y2="26" stroke="#46632e" stroke-width="0.8"/>
  <!-- Diagnostic dot/anomaly marker on leaf -->
  <circle cx="25" cy="27" r="1.5" fill="#fbbf24"/>
  <!-- Crosshair-style markers around the lens (clinical/precision feel) -->
  <line x1="28" y1="11" x2="28" y2="14" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="28" x2="14" y2="28" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="42" y1="28" x2="45" y2="28" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
</svg>
