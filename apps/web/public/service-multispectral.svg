<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#46632e"/>
  <!-- Drone body (top-down view) -->
  <circle cx="32" cy="32" r="6" fill="#fff"/>
  <!-- Camera lens center -->
  <circle cx="32" cy="32" r="2.5" fill="#46632e"/>
  <!-- Drone arms -->
  <line x1="32" y1="32" x2="18" y2="18" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="46" y2="18" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="18" y2="46" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="46" y2="46" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Rotors -->
  <circle cx="18" cy="18" r="4" fill="none" stroke="#bbf7d0" stroke-width="1.5"/>
  <circle cx="46" cy="18" r="4" fill="none" stroke="#bbf7d0" stroke-width="1.5"/>
  <circle cx="18" cy="46" r="4" fill="none" stroke="#bbf7d0" stroke-width="1.5"/>
  <circle cx="46" cy="46" r="4" fill="none" stroke="#bbf7d0" stroke-width="1.5"/>
  <!-- Multispectral scan beam (yellow signal) -->
  <path d="M32 38 L26 56 L38 56 Z" fill="#fbbf24" opacity="0.5"/>
  <line x1="29" y1="50" x2="35" y2="50" stroke="#fbbf24" stroke-width="1.2" opacity="0.9"/>
</svg>
