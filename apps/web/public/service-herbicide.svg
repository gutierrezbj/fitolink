<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#46632e"/>
  <!-- Field lines (rows of crops) -->
  <line x1="14" y1="28" x2="50" y2="28" stroke="#bbf7d0" stroke-width="1.2" opacity="0.55"/>
  <line x1="14" y1="36" x2="50" y2="36" stroke="#bbf7d0" stroke-width="1.2" opacity="0.55"/>
  <line x1="14" y1="44" x2="50" y2="44" stroke="#bbf7d0" stroke-width="1.2" opacity="0.55"/>
  <!-- Crop dots aligned in rows -->
  <circle cx="20" cy="28" r="1.6" fill="#bbf7d0"/>
  <circle cx="32" cy="28" r="1.6" fill="#bbf7d0"/>
  <circle cx="44" cy="28" r="1.6" fill="#bbf7d0"/>
  <circle cx="20" cy="36" r="1.6" fill="#bbf7d0"/>
  <circle cx="44" cy="36" r="1.6" fill="#bbf7d0"/>
  <circle cx="20" cy="44" r="1.6" fill="#bbf7d0"/>
  <circle cx="32" cy="44" r="1.6" fill="#bbf7d0"/>
  <circle cx="44" cy="44" r="1.6" fill="#bbf7d0"/>
  <!-- Targeted weed (off-row, highlighted) -->
  <circle cx="26" cy="32" r="3" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="26" y1="29" x2="26" y2="35" stroke="#fbbf24" stroke-width="1.3"/>
  <line x1="23" y1="32" x2="29" y2="32" stroke="#fbbf24" stroke-width="1.3"/>
  <!-- Second targeted weed -->
  <circle cx="38" cy="40" r="2.5" fill="none" stroke="#fbbf24" stroke-width="1.8"/>
  <!-- Spray indicator line at top -->
  <path d="M16 16 L48 16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="16" x2="22" y2="22" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
  <line x1="32" y1="16" x2="32" y2="22" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
  <line x1="42" y1="16" x2="42" y2="22" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
</svg>
