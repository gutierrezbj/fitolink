<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="32" fill="#46632e"/>
  <!-- Briefcase body -->
  <rect x="14" y="24" width="36" height="26" rx="2.5" fill="#fff"/>
  <!-- Briefcase handle -->
  <path d="M26 24 v-3 q0 -2 2 -2 h8 q2 0 2 2 v3" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Lock at top center -->
  <rect x="30" y="26" width="4" height="3" rx="0.6" fill="#46632e"/>
  <!-- Leaf on briefcase (agro) -->
  <path d="M22 36 Q28 30 36 34 Q32 42 22 36 Z" fill="#46632e"/>
  <line x1="24" y1="36" x2="32" y2="36" stroke="#fff" stroke-width="0.8"/>
  <!-- Magnifier on the right -->
  <circle cx="40" cy="38" r="4.5" fill="none" stroke="#46632e" stroke-width="2"/>
  <line x1="43.3" y1="41.3" x2="46" y2="44" stroke="#46632e" stroke-width="2" stroke-linecap="round"/>
</svg>
