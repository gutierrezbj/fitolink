<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle: lime green (advisor/expert) -->
  <circle cx="32" cy="32" r="32" fill="#65a30d"/>
  <!-- Briefcase body -->
  <rect x="14" y="24" width="36" height="26" rx="2.5" fill="#fff"/>
  <!-- Briefcase handle -->
  <path d="M26 24 v-3 q0 -2 2 -2 h8 q2 0 2 2 v3" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- Lock at top center -->
  <rect x="30" y="26" width="4" height="3" rx="0.6" fill="#65a30d"/>
  <!-- Leaf on left side -->
  <path d="M21 34 q4 -8 11 -3 q-2 9 -11 3 z" fill="#bbf7d0"/>
  <line x1="22" y1="34" x2="29" y2="32" stroke="#65a30d" stroke-width="0.6"/>
  <!-- Magnifier on right side -->
  <circle cx="40" cy="36" r="4.5" fill="none" stroke="#65a30d" stroke-width="1.6"/>
  <line x1="43" y1="39" x2="46" y2="42" stroke="#65a30d" stroke-width="2" stroke-linecap="round"/>
  <!-- Crosshair markers (advisor analyzes) -->
  <line x1="32" y1="46" x2="32" y2="48" stroke="#65a30d" stroke-width="0.8"/>
  <line x1="38" y1="46" x2="38" y2="48" stroke="#65a30d" stroke-width="0.8"/>
  <!-- Telemetry signal arc top right -->
  <path d="M45 16 Q53 16 53 8" stroke="#fbbf24" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle cx="53" cy="8" r="1.5" fill="#fbbf24"/>
</svg>
